<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
</head>
<body>
<title>荒原灰模驗證</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-screen portrait 3D view; status strip on top, 2-row command grid pinned to the bottom */
:root{
  --bg:#1c1915; --panel:rgba(30,26,21,.9); --line:#57493a; --text:#efe5d3; --muted:#b0a089; --accent:#e2a640; --ok:#8fc56e;
  --font:"Noto Sans HK",system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;gap:6px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.45;min-width:0}
.chip b{color:var(--accent)}
#perf{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11.5px;white-space:pre;text-align:right;flex:none}
.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;
  padding-top:24px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(28,25,21,0),rgba(28,25,21,.92) 35%)}
.bottom button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:4px 2px;font-size:13px;font-weight:700;line-height:1.2;cursor:pointer}
.bottom button small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.bottom button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.bottom button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bottom .wide{grid-column:span 2}
#err{position:fixed;inset:30% 16px auto;background:#3a1d17;border:1px solid #a4462f;border-radius:12px;padding:14px;font-size:14px}
</style>

<canvas id="c" aria-label="灰模場景"></canvas>
<div class="top">
  <div class="row"><div class="chip" id="st"></div><div class="chip" id="perf">FPS --</div></div>
</div>
<div class="bottom">
  <button id="bArmor">換甲<small id="sArmor"></small></button>
  <button id="bWeapon">換刀<small id="sWeapon"></small></button>
  <button id="bCut">斷左手<small>永久</small></button>
  <button id="bPros">裝義肢<small id="sPros"></small></button>
  <button id="bCarry">A 揹起 B<small id="sCarry"></small></button>
  <button id="bBed">B 上床<small>瞓低</small></button>
  <button id="bWalk" aria-pressed="false">A 行路<small>開／關</small></button>
  <button id="bReset">重置</button>
  <button id="bStress" class="wide" aria-pressed="false">壓力測試 100 人<small>隨機裝備，到處行</small></button>
  <button id="bOutline" aria-pressed="true">描邊<small>開／關</small></button>
  <button id="bZoom">拉近／拉遠</button>
</div>
<div id="err" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.31.3/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-materials@9.31.3/babylonjs.materials.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
if(!window.BABYLON||!BABYLON.CellMaterial){$('err').hidden=false;$('err').textContent='載入唔到 Babylon.js，請檢查網絡再重新整理。';return}
const B=BABYLON,V3=B.Vector3,C3=B.Color3;
const canvas=$('c');
const engine=new B.Engine(canvas,true,{stencil:true,antialias:true},true);
engine.setHardwareScalingLevel(1/Math.min(2,window.devicePixelRatio||1));
const scene=new B.Scene(engine);
scene.clearColor=new B.Color4(.36,.33,.28,1);
scene.ambientColor=new C3(.3,.3,.3);

/* ---------- camera: fixed angle, orthographic ---------- */
const cam=new B.ArcRotateCamera('cam',-Math.PI/4,1.02,30,new V3(.9,.4,.1),scene);
cam.mode=B.Camera.ORTHOGRAPHIC_CAMERA;cam.minZ=.1;cam.maxZ=200;
let zoom=2.6;
function fitOrtho(){const a=engine.getRenderWidth()/engine.getRenderHeight();cam.orthoTop=zoom;cam.orthoBottom=-zoom;cam.orthoLeft=-zoom*a;cam.orthoRight=zoom*a}
fitOrtho();

new B.HemisphericLight('sky',new V3(.2,1,.1),scene).intensity=.55;
const sun=new B.DirectionalLight('sun',new V3(-.5,-1,.35),scene);sun.intensity=.85;

/* ---------- hand-painted materials ---------- */
const PAL={skin:'#d6a27a',hair:'#2b2420',linen:'#cfc2a6',pants:'#4e4a44',clothA:'#4f5f7a',clothB:'#7a5a3e',leather:'#7a4e2c',plate:'#8f9aa2',
  wood:'#8a6a45',blade:'#cdd2d6',rust:'#7d5a43',bolt:'#3b3632',mil:'#4d6676',milDark:'#2f3f49',stump:'#9c3a2a',bedframe:'#6e5236',sheet:'#e3d8c4',
  ground:'#8b7a5f',rock:'#77706a',shadow:'#000000'};
function painted(hex,size=128,strokes=70){
  const t=new B.DynamicTexture('t'+hex,{width:size,height:size},scene,true);const g=t.getContext();
  g.fillStyle=hex;g.fillRect(0,0,size,size);const c=C3.FromHexString(hex);
  for(let i=0;i<strokes;i++){const k=Math.random()<.5?1.18:.82,a=.14+Math.random()*.18;
    g.strokeStyle=`rgba(${Math.min(255,c.r*255*k)|0},${Math.min(255,c.g*255*k)|0},${Math.min(255,c.b*255*k)|0},${a})`;
    g.lineWidth=2+Math.random()*size/18;g.lineCap='round';const x=Math.random()*size,y=Math.random()*size,l=size*(.08+Math.random()*.2),r=Math.random()*.6-.3+.6;
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+l*.5,y+l*r*.3,x+l,y+l*r*.5);g.stroke()}
  t.update();t.wrapU=t.wrapV=B.Texture.WRAP_ADDRESSMODE;return t}
const MAT={};
function mat(key){if(MAT[key])return MAT[key];const m=new B.CellMaterial('m_'+key,scene);m.diffuseTexture=painted(PAL[key]);m.computeHighLevel=true;MAT[key]=m;return m}

/* ---------- source part library (instanced) ---------- */
const SRC={};let outlineOn=true;
function src(name,builder,matKey,pivotTop){
  if(SRC[name])return SRC[name];const m=builder();m.name='src_'+name;
  if(pivotTop){const h=m.getBoundingInfo().boundingBox.extendSize.y;m.bakeTransformIntoVertices(B.Matrix.Translation(0,-h,0))}
  m.material=mat(matKey);m.isVisible=false;m.renderOutline=outlineOn;m.outlineWidth=.012;m.outlineColor=new C3(.1,.08,.06);
  SRC[name]=m;return m}
const MB=B.MeshBuilder;
const box=(w,h,d)=>()=>MB.CreateBox('b',{width:w,height:h,depth:d},scene);
const cyl=(r,h,t=6)=>()=>MB.CreateCylinder('c',{diameter:r*2,height:h,tessellation:t},scene);
const ico=(r)=>()=>MB.CreateIcoSphere('i',{radius:r,subdivisions:1,flat:true},scene);
const PARTS={
  head:['skin',ico(.15)], hairA:['hair',box(.27,.09,.27)], hairB:['hair',box(.24,.07,.3)],
  torso:['linen',box(.34,.44,.2)], pelvis:['pants',box(.33,.14,.2)],
  uArm:['skin',box(.1,.3,.1),1], fArm:['skin',box(.09,.27,.09),1], hand:['skin',box(.1,.1,.1),1],
  uLeg:['pants',box(.13,.4,.14),1], lLeg:['pants',box(.12,.42,.12),1], foot:['bolt',box(.13,.07,.2)],
  clothA:['clothA',box(.38,.5,.24)], clothB:['clothB',box(.38,.5,.24)], sash:['stump',box(.4,.06,.26)],
  leather:['leather',box(.4,.42,.26)], pad:['leather',box(.15,.08,.17)],
  plate:['plate',box(.42,.46,.28)], plateShoulder:['plate',box(.17,.11,.19)], helmet:['plate',cyl(.17,.12,8)],
  grip:['wood',cyl(.025,.14),1], knife:['blade',box(.03,.2,.06),1], machete:['blade',box(.03,.48,.08),1],
  haft:['wood',cyl(.025,.78),1], axeHead:['blade',box(.04,.18,.22)],
  stump:['stump',box(.11,.05,.11)],
  sUArm:['rust',cyl(.055,.3,5),1], sFArm:['rust',box(.07,.27,.07),1], sBolt:['bolt',box(.12,.04,.12)], sClaw:['bolt',box(.11,.09,.06),1],
  mUArm:['mil',box(.12,.3,.12),1], mFArm:['mil',box(.11,.28,.11),1], mJoint:['milDark',ico(.065)], mHand:['milDark',box(.11,.11,.11),1],
  shadow:['shadow',()=>MB.CreateDisc('d',{radius:.32,tessellation:12},scene)],
};
function inst(key,parent,x=0,y=0,z=0){
  const [mk,b,pt]=PARTS[key];const s=src(key,b,mk,pt);const i=s.createInstance(key);i.parent=parent;i.position.set(x,y,z);return i}
function tn(name,parent,x=0,y=0,z=0){const n=new B.TransformNode(name,scene);n.parent=parent;n.position.set(x,y,z);return n}

/* ---------- character: bone nodes + swappable parts ---------- */
const ARMORS=['布衣','皮甲','鐵甲'],WEAPONS=['短刀','砍刀','重斧'],PROS=['廢鐵','軍用'];
function makeChar(x,z,variant){
  const c={variant,armor:0,weapon:1,arm:'flesh',mode:'idle',t:Math.random()*10,look:[],lArm:[]};
  const root=c.root=tn('char',null,x,0,z);
  const sh=inst('shadow',root,0,.01,0);sh.rotation.x=Math.PI/2;
  const hips=c.hips=tn('hips',root,0,.92,0);inst('pelvis',hips,0,0,0);
  const torso=c.torso=tn('torso',hips,0,.05,0);inst('torso',torso,0,.22,0);
  c.neck=tn('neck',torso,0,.46,0);inst('head',c.neck,0,.14,0);inst(variant?'hairB':'hairA',c.neck,0,.27,variant?.02:0);
  c.helmetSocket=tn('helm',c.neck,0,.27,0);
  for(const s of [-1,1]){const k=s<0?'L':'R';
    const shoulder=c['sh'+k]=tn('sh'+k,torso,.23*s,.42,0),elbow=c['el'+k]=tn('el'+k,shoulder,0,-.3,0),hand=c['ha'+k]=tn('ha'+k,elbow,0,-.27,0);
    c['pad'+k]=tn('pad'+k,shoulder,0,.02,0);
    if(k==='R'){inst('uArm',shoulder);inst('fArm',elbow);inst('hand',hand);c.weaponSocket=tn('wpn',hand,0,-.06,0);c.weaponSocket.rotation.x=Math.PI/2}
    const hip=c['hip'+k]=tn('hip'+k,hips,.09*s,0,0),knee=c['kn'+k]=tn('kn'+k,hip,0,-.4,0);
    inst('uLeg',hip);inst('lLeg',knee);inst('foot',knee,0,-.45,.03)}
  c.carrySocket=tn('carry',torso,0,.55,0);
  applyLook(c);return c}
function clear(list){list.forEach(m=>m.dispose());list.length=0}
function applyLook(c){
  clear(c.look);const L=c.look,T=c.torso;
  L.push(inst(c.variant?'clothB':'clothA',T,0,.2,0),inst('sash',T,0,.02,0));
  if(c.armor>=1&&c.armor<2){L.push(inst('leather',T,0,.24,0),inst('pad',c.padL),inst('pad',c.padR))}
  if(c.armor===2){L.push(inst('plate',T,0,.24,0),inst('plateShoulder',c.padL),inst('plateShoulder',c.padR),inst('helmet',c.helmetSocket,0,-.02,0))}
  const w=c.weaponSocket;
  if(c.weapon===0)L.push(inst('grip',w,0,.07,0),inst('knife',w,0,-.0,0));
  if(c.weapon===1)L.push(inst('grip',w,0,.07,0),inst('machete',w,0,0,0));
  if(c.weapon===2){L.push(inst('haft',w,0,.3,0),inst('axeHead',w,0,-.38,.08))}
  clear(c.lArm);const A=c.lArm;
  if(c.arm==='flesh'){A.push(inst('uArm',c.shL),inst('fArm',c.elL),inst('hand',c.haL))}
  else if(c.arm==='lost'){A.push(inst('stump',c.shL,0,-.02,0))}
  else if(c.arm==='scrap'){A.push(inst('sBolt',c.shL,0,-.01,0),inst('sUArm',c.shL,0,-.03,0),inst('sFArm',c.elL),inst('sClaw',c.haL))}
  else if(c.arm==='mil'){A.push(inst('mJoint',c.shL),inst('mUArm',c.shL,0,-.04,0),inst('mJoint',c.elL),inst('mFArm',c.elL,0,-.02,0),inst('mHand',c.haL,0,-.02,0))}
  c.elL.position.y=c.arm==='mil'?-.33:-.3;
}

/* ---------- poses (procedural, no new animation per look) ---------- */
function pose(c,dt){
  c.t+=dt;const t=c.t,r=(n,x=0,y=0,z=0)=>n.rotation.set(x,y,z);
  r(c.hips);r(c.torso);r(c.neck);c.hips.position.y=.92;
  const m=c.mode;
  if(m==='lying'){r(c.shL,0,0,-.25);r(c.shR,0,0,.25);r(c.elL);r(c.elR);r(c.hipL);r(c.hipR);r(c.knL);r(c.knR);c.torso.rotation.x=Math.sin(t*1.2)*.015;return}
  if(m==='carried'){const sway=Math.sin(t*3)*.08;r(c.torso,0,0,0);r(c.shL,0,0,-1.45+sway);r(c.shR,0,0,-1.45+sway*.7);r(c.elL);r(c.elR);r(c.neck,0,0,.45);
    r(c.hipL,0,0,-1.35+sway);r(c.hipR,0,0,-1.35-sway);r(c.knL);r(c.knR);return}
  const walk=m==='walk'||m==='carryWalk',ph=t*7,sw=walk?Math.sin(ph):0;
  r(c.hipL,sw*.55);r(c.hipR,-sw*.55);r(c.knL,Math.max(0,-sw)*.7);r(c.knR,Math.max(0,sw)*.7);
  c.hips.position.y=.92+(walk?Math.abs(Math.cos(ph))*.035:Math.sin(t*1.8)*.008);
  if(m==='carry'||m==='carryWalk'){r(c.shL,-2.75,0,-.25);r(c.shR,-2.75,0,.25);r(c.elL,-.5);r(c.elR,-.5);c.torso.rotation.x=.12;return}
  c.torso.rotation.x=walk?.06:Math.sin(t*1.8)*.02;
  r(c.shL,-sw*.6,0,-.1);r(c.elL,-.25);r(c.shR,sw*.6-.15,0,.1);r(c.elR,-.55);
}

/* ---------- world ---------- */
const ground=MB.CreateGround('g',{width:40,height:40},scene);const gm=new B.CellMaterial('gm',scene);
gm.diffuseTexture=painted(PAL.ground,512,900);gm.diffuseTexture.uScale=gm.diffuseTexture.vScale=6;ground.material=gm;
for(let i=0;i<16;i++){const a=i*2.4+.8,d=5+i*.8;const r=MB.CreateIcoSphere('rock',{radius:.15+Math.random()*.25,subdivisions:1,flat:true},scene);
  r.position.set(Math.cos(a)*d,.05,Math.sin(a)*d);r.scaling.y=.6;r.material=mat('rock');r.renderOutline=true;r.outlineWidth=.012;r.outlineColor=new C3(.1,.08,.06)}
const bed=tn('bed',null,1.9,0,-.4);
[[box(.9,.32,1.95),'bedframe',.16],[box(.82,.12,1.85),'sheet',.38],[box(.62,.1,.28),'sheet',.48]].forEach(([b,k,y],i)=>{
  const m=b();m.parent=bed;m.position.y=y;if(i===2)m.position.z=-.74;m.material=mat(k);m.renderOutline=true;m.outlineWidth=.012;m.outlineColor=new C3(.1,.08,.06)});
mat('shadow').alpha=.28;mat('shadow').diffuseTexture=null;mat('shadow').diffuseColor=new C3(0,0,0);

const A=makeChar(-.7,.6,0),Bc=makeChar(.6,1.1,1);Bc.root.rotation.y=-.4;
const chars=[A,Bc];let walkOn=false,walkT=0,crowd=[];

function detachB(){Bc.root.parent=null;Bc.root.rotation.set(0,-.4,0);Bc.root.position.set(.6,0,1.1)}
function setState(){
  $('sArmor').textContent=ARMORS[A.armor];$('sWeapon').textContent=WEAPONS[A.weapon];
  $('sPros').textContent=A.arm==='lost'?'廢鐵／軍用':A.arm==='scrap'?'而家：廢鐵':A.arm==='mil'?'而家：軍用':'要先斷手';
  $('sCarry').textContent=Bc.mode==='carried'?'而家：放低':'揹起';
  const arm={flesh:'正常',lost:'斷咗',scrap:'廢鐵義肢',mil:'軍用義肢'}[A.arm];
  $('st').innerHTML=`<b>A</b> ${ARMORS[A.armor]} · ${WEAPONS[A.weapon]} · 左手：${arm}<br><b>B</b> ${{idle:'企喺度',carried:'俾 A 揹緊',lying:'瞓喺床上'}[Bc.mode]||'企喺度'}`;
}
$('bArmor').onclick=()=>{A.armor=(A.armor+1)%3;applyLook(A);setState()};
$('bWeapon').onclick=()=>{A.weapon=(A.weapon+1)%3;applyLook(A);setState()};
$('bCut').onclick=()=>{A.arm='lost';applyLook(A);setState()};
$('bPros').onclick=()=>{if(A.arm==='flesh'){A.arm='lost'}else A.arm=A.arm==='scrap'?'mil':'scrap';applyLook(A);setState()};
$('bCarry').onclick=()=>{
  if(Bc.mode==='carried'){detachB();Bc.mode='idle';A.mode=walkOn?'walk':'idle';setState();return}
  Bc.mode='carried';Bc.root.parent=A.carrySocket;Bc.root.rotation.set(0,0,Math.PI/2);Bc.root.position.set(.92,-.05,0);A.mode=walkOn?'carryWalk':'carry';setState()};
$('bBed').onclick=()=>{if(Bc.mode==='carried')A.mode=walkOn?'walk':'idle';
  Bc.mode='lying';Bc.root.parent=bed;Bc.root.rotation.set(-Math.PI/2,0,0);Bc.root.position.set(0,.56,.86);setState()};
$('bWalk').onclick=e=>{walkOn=!walkOn;e.currentTarget.setAttribute('aria-pressed',walkOn);
  A.mode=A.mode.startsWith('carry')?(walkOn?'carryWalk':'carry'):(walkOn?'walk':'idle');if(!walkOn){A.root.position.set(-.7,0,.6);A.root.rotation.y=0}};
$('bReset').onclick=()=>{A.armor=0;A.weapon=1;A.arm='flesh';detachB();Bc.mode='idle';walkOn=false;$('bWalk').setAttribute('aria-pressed','false');
  A.mode='idle';A.root.position.set(-.7,0,.6);A.root.rotation.y=0;applyLook(A);setState()};
$('bOutline').onclick=e=>{outlineOn=!outlineOn;e.currentTarget.setAttribute('aria-pressed',outlineOn);
  Object.values(SRC).forEach(m=>m.renderOutline=outlineOn);scene.meshes.forEach(m=>{if(!m.isAnInstance&&m.outlineWidth)m.renderOutline=outlineOn})};
let zi=0;const ZS=[2.6,1.5,5.5];$('bZoom').onclick=()=>{zi=(zi+1)%ZS.length;zoom=ZS[zi];fitOrtho()};
$('bStress').onclick=e=>{
  if(crowd.length){crowd.forEach(c=>c.root.dispose());crowd=[];e.currentTarget.setAttribute('aria-pressed','false');zoom=2.6;fitOrtho();return}
  for(let i=0;i<100;i++){const a=Math.random()*Math.PI*2,d=3+Math.random()*9;const c=makeChar(Math.cos(a)*d,Math.sin(a)*d,i%2);
    c.armor=i%3;c.weapon=(i>>1)%3;c.arm=['flesh','flesh','lost','scrap','mil'][i%5];applyLook(c);c.mode='walk';c.goal=null;crowd.push(c)}
  e.currentTarget.setAttribute('aria-pressed','true');zoom=7;fitOrtho()};

/* ---------- touch camera: one-finger pan, pinch zoom ---------- */
const pts=new Map();let pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const [p,q]=[...pts.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y),z:zoom}}});
canvas.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size===2&&pinch){p.x=e.clientX;p.y=e.clientY;const [a,b]=[...pts.values()];zoom=Math.min(9,Math.max(1,pinch.z*pinch.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));fitOrtho();return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  const k=2*zoom/canvas.clientHeight,right=cam.getDirection(V3.Right()),fwd=cam.getDirection(V3.Up());right.y=0;fwd.y=0;right.normalize();fwd.normalize();
  cam.target.addInPlace(right.scale(-dx*k)).addInPlace(fwd.scale(dy*k/Math.sin(cam.beta)))});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(9,Math.max(1,zoom*Math.exp(e.deltaY*.0012)));fitOrtho()},{passive:false});

/* ---------- loop & perf readout ---------- */
new B.SceneInstrumentation(scene);let lastDC=0;scene.onAfterRenderObservable.add(()=>{const d=engine._drawCalls;if(d)lastDC=d.current});
let perfT=0;
scene.onBeforeRenderObservable.add(()=>{
  const dt=Math.min(.05,engine.getDeltaTime()/1000);
  if(walkOn){walkT+=dt*.45;A.root.position.set(-.7+Math.cos(walkT)*1.6,0,.6+Math.sin(walkT)*1.6-1.6);A.root.rotation.y=-walkT+Math.PI}
  chars.forEach(c=>pose(c,dt));
  for(const c of crowd){if(!c.goal||V3.Distance(c.root.position,c.goal)<.2){const a=Math.random()*Math.PI*2,d=3+Math.random()*9;c.goal=new V3(Math.cos(a)*d,0,Math.sin(a)*d)}
    const dir=c.goal.subtract(c.root.position);dir.y=0;dir.normalize();c.root.position.addInPlace(dir.scale(dt*1.1));c.root.rotation.y=Math.atan2(dir.x,dir.z);pose(c,dt)}
  perfT+=dt;if(perfT>.5){perfT=0;
    const dc=lastDC||'?';
    $('perf').textContent=`FPS ${engine.getFps().toFixed(0)}\ndraw ${dc}\n角色 ${2+crowd.length}`}
});
setState();
engine.runRenderLoop(()=>scene.render());
addEventListener('resize',()=>{engine.resize();fitOrtho()});
window.__gb={scene,engine,A,Bc};
})();
</script>
